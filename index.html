<!DOCTYPE html>
<html>
    <head>
        <title>Js Calculator 0.1</title>
    </head>
    <style>
        #div1{
            margin-top: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        #div2{
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            
        }
        #addBtn{
            width: 100px;
            height: 70px;
            background-color: rgb(255, 145, 145);
        }
        body{
            background-color: rgb(0, 0, 0);
            overflow: hidden;
        }
        #ansT{
            color: rgb(0, 255, 42);
        }
        #version{
            position: fixed;
            bottom: 30px;
            left: 30px;
            color: rgb(156, 156, 156);
        }
        #theme{
        display: flex;
        justify-content: center;
        margin-left: 10px;
        height: 35px;
        width: 120px;
        border-radius: 999px;
        border: none;
        position: relative;
        bottom: 250px;
        left: 10px;
        }

    </style>

    <body id="body">

        
        <div id="div1">
            <input id="inpt1">
            <input id="inpt2">
        </div>
        <div id="div2">
            <button id="addBtn">ADD</button>
            <h1 id="ansT">Answer</h1>
        </div>
        <div id="theme">
        <button id="themeB">Change theme</button>
            </div>
        <p id="version">Version 0.1</p>



    <script>

        let inpt1 = 
        document.getElementById("inpt1");
        let inpt2 = 
        document.getElementById("inpt2");
        let addBtn = 
        document.getElementById("addBtn");
        let ansT = 
        document.getElementById("ansT");
        let themeBtn = 
        document.getElementById("themeB")
        let body = 
        document.getElementById("body")
        let nightmode = true;

        addBtn.onclick = function(){
            let ans = 
            Number(inpt1.value) + Number(inpt2.value)
            ansT.textContent = "The answer is : " + ans;

        }

        themeBtn.onclick = function(){
            if(nightmode === true){
            body.style.backgroundColor = "gray";
            nightmode = false;
        }
        else{
            body.style.backgroundColor = "black";
            nightmode = true;

        }
    }

</script>


</body>

</html>
